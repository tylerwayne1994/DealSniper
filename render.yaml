services:
  - type: web
    name: dealsniper-backend
    runtime: python
    buildCommand: "cd backend && pip install -r requirements.txt && export PLAYWRIGHT_BROWSERS_PATH=/opt/render/project/src/backend/.browsers && playwright install chromium --with-deps && find /opt/render/project/src/backend/.browsers -name chrome -type f | head -1 > .chromium_path && echo 'CHROMIUM_PATH saved:' && cat .chromium_path"
    startCommand: "cd backend && uvicorn App:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/project/src/backend/.browsers
      - key: MISTRAL_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: CLAUDE_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PERPLEXITY_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://dealsniper-oh9v.onrender.com/auth/google/callback
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://dealsniper.vercel.app
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PRICE_ID_BASE
        sync: false
      - key: PRICE_ID_PRO
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.0"
